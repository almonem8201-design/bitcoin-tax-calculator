<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비트코인 세금 간편 계산기 | 생활ZIP</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#182235;margin:0;padding:22px}.card{max-width:520px;margin:25px auto;background:white;padding:28px;border-radius:20px;box-shadow:0 8px 30px #18223512}h1{font-size:24px;margin:0 0 8px}.sub,.note{color:#657083;font-size:13px;line-height:1.7}label{display:block;margin:26px 0 9px;font-weight:700}input{width:100%;font-size:22px;padding:14px;border:1px solid #c9d2e0;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.cell{background:#f3f6fa;padding:16px;border-radius:12px}.cell small,.result small{display:block;color:#657083;margin-bottom:9px}.cell strong{font-size:21px}.result{background:#edf4ff;border-radius:12px;padding:22px}.result strong{font-size:30px;color:#1254c5;word-break:break-word}.result p{font-size:13px;margin-bottom:0}button{width:100%;padding:13px;background:#233d68;color:white;border:0;border-radius:10px;margin:18px 0;cursor:pointer;font-size:16px}@media(max-width:380px){.card{padding:18px}.cell strong{font-size:17px}.result strong{font-size:25px}}</style></head><body><main class="card"><h1>₿ 비트코인 세금 간편 계산기</h1><p class="sub">2027년 예정 과세 기준 가정 · 단순 모의계산<br>실제 시행 시점과 세법은 변경될 수 있습니다.</p><label for="profit">연간 손익통산 후 순이익 (만원)</label><input id="profit" type="number" min="0" step="any" value="1000" inputmode="decimal"><div class="grid"><div class="cell"><small>기본공제</small><strong>250만원</strong></div><div class="cell"><small>과세 대상 금액</small><strong id="taxable">750만원</strong></div></div><div class="result" aria-live="polite"><small>예상 세금 (지방소득세 포함)</small><strong id="tax">1,650,000원</strong><p>과세 대상 금액 × 22%</p></div><button type="button" id="reset">초기화</button><p class="note">이 계산기는 정보 제공용이며 세무 신고용 계산 결과가 아닙니다. 수수료, 취득가액 특례, 개별 거래 유형, 손실 이월 여부 및 향후 법 개정은 반영하지 않았습니다. 음수 입력은 0으로 처리합니다.</p><p class="sub">생활ZIP</p></main><script>const input=document.getElementById('profit'),taxable=document.getElementById('taxable'),tax=document.getElementById('tax');function calculate(){const p=Math.max(0,Number(input.value)||0);const base=Math.max(0,p-250);taxable.textContent=base.toLocaleString('ko-KR',{maximumFractionDigits:4})+'만원';tax.textContent=Math.round(base*10000*.22).toLocaleString('ko-KR')+'원'}input.addEventListener('input',calculate);document.getElementById('reset').addEventListener('click',()=>{input.value='1000';calculate()});calculate();</script></body></html>
